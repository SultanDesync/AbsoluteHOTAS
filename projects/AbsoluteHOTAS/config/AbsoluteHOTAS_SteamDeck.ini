; AbsoluteHOTAS_SteamDeck.ini - v2.5-beta
; Pre-set configuration profile optimized for Steam Deck and Linux/Proton gamepads.
; Rename this file to AbsoluteHOTAS.ini to use it.
; See docs/reference/ini-reference.md for detailed documentation.

[General]
bEnabled = true

[Hardware]
; Standard Xbox/Steam Deck gamepad axis indices under Proton DirectInput:
; 0x30 = Left Stick X, 0x31 = Left Stick Y, 0x33 = Right Stick X, 0x34 = Right Stick Y, 0x32 = Triggers (Z combined)
iThrottleAxis = 0x31            ; Left Stick Y (drives throttle rate)
iStrafeLatAxis = 0x30           ; Left Stick X (strafe left/right)
iYawAxis = 0x33                 ; Right Stick X (steer yaw)
iPitchAxis = 0x34               ; Right Stick Y (steer pitch)
iRollAxis =                     ; Unbound (controlled by game auto-roll or bumpers)
iStrafeVertAxis =               ; Unbound (controlled by bumpers or buttons)

; Invert Left Stick Y so pushing forward increases throttle, and pulling back decreases/brakes
bInvertThrottle = true
bInvertPitch = false
bInvertYaw = false
bInvertRoll = false
bInvertStrafeLat = false
bInvertStrafeVert = false

fPitchSensitivity = 1.0
fYawSensitivity = 1.0
fRollSensitivity = 1.0
fStrafeSensitivity = 1.0
fThrottleSensitivity = 1.0

fThrottleSaturation = 1.0
fPitchSaturation = 1.0
fYawSaturation = 1.0
fRollSaturation = 1.0
fStrafeSaturation = 1.0
fStrafeVertSaturation = 1.0

; Slightly larger deadzones (8%) for analog thumbstick centering stability
fThrottleDeadzone = 0.08
fPitchDeadzone = 0.08
fYawDeadzone = 0.08
fRollDeadzone = 0.08
fStrafeDeadzone = 0.08
fStrafeVertDeadzone = 0.08

[Buttons]
bAlwaysOn = true
iActivateButtonId = -1
iStopButtonId = -1
iToggleWizardButton = -1

[ShipButtons]
bShipButtonsEnabled = true
; Button bindings are left unbound by default so that the player can utilize native 
; Steam Input mapping to standard keyboard keys without game input fighting.
iFireBoostersButton = -1
iSwitchFlightModesButton = -1
iTogglePovButton = -1
iFireWeapon0Button = -1
iFireWeapon1Button = -1
iFireWeapon2Button = -1
iShipAction1Button = -1
iSelectTargetButton = -1
iIncreaseSystemPowerButton = -1
iDecreaseSystemPowerButton = -1
iPreviousSystemButton = -1
iNextSystemButton = -1
iOpenScannerButton = -1
iRepairButton = -1
iShipAlternateControlHoldButton = -1
iCruiseButton = -1
iCancelButton = -1
iUndockTakeOffButton = -1
iGetUpButton = -1
iExitShipFromCockpitButton = -1
iZoomCameraInButton = -1
iZoomCameraOutButton = -1
iAutopilotOnOffButton = -1

[ShipButtonOutputs]
sFireBoostersOutput = key:0x2A
sSwitchFlightModesOutput = key:0x39
sTogglePovOutput = key:0x10
sFireWeapon0Output = mouse:1
sFireWeapon1Output = mouse:2
sFireWeapon2Output = key:0x22
sShipAction1Output = key:0x13
sSelectTargetOutput = key:0x12
sIncreaseSystemPowerOutput = key:0x48
sDecreaseSystemPowerOutput = key:0x50
sPreviousSystemOutput = key:0x4B
sNextSystemOutput = key:0x4D
sOpenScannerOutput = key:0x21
sRepairOutput = key:0x18
sShipAlternateControlHoldOutput = key:0x38
sCruiseOutput = key:0x14
sCancelOutput = none
sUndockTakeOffOutput = key:0x39
sGetUpOutput = key:0x12
sExitShipFromCockpitOutput = key:0x2D
sZoomCameraInOutput = mouse:1
sZoomCameraOutOutput = mouse:2
sAutopilotOnOffOutput = key:0x39

[ButtonExpansion]

[Normalization]
bUnipolarMode = true
fIdlePlateau = 0.05
bReverseAxisEnabled = true

[Injection]
iPollRateHz = 120
iThrottleBurstMs = 250
bLogThrottle = false
bRollEnabled = true

[DigitalAxes]
iDigitalReverseButton = -1
iDigitalRollLeftButton = -1
iDigitalRollRightButton = -1
iDigitalStrafeLeftButton = -1
iDigitalStrafeRightButton = -1
iDigitalStrafeUpButton = -1
iDigitalStrafeDownButton = -1
fDigitalRollValue = 1.0
fDigitalStrafeValue = 1.0

[Calibration]

[Aim]
bSourceObjectAim = true
fAimSensitivity = 1.0
bMirrorFlightToAim = true
iAimYawAxis =
iAimPitchAxis =
fAimYawSensitivity = 1.0
fAimPitchSensitivity = 1.0
bInvertAimYaw = false
bInvertAimPitch = false
fAimSmoothing = 0.0
iDigitalAimLeftButton = -1
iDigitalAimRightButton = -1
iDigitalAimUpButton = -1
iDigitalAimDownButton = -1
iDigitalAimCenterButton = -1
fDigitalAimValue = 1.0
iToggleAimModeButton = -1
bHOSAMMode = false
bAlignmentAssist = false
fAlignmentRadius = 15.0
iAlignmentIdleMs = 80
fAlignmentDecayRate = 4.0

[DualStick]
; Enable rate-based throttle accumulator for self-centering left thumbstick Y-axis
bAccumulatorThrottle = true
fAccumulatorRate = 1.25          ; Snappy ramp speed
fAccumulatorDecay = 0.0          ; 0.0 = Hold throttle position when stick is released to center
fReverseGateVelocity = 5.0       ; Allow reverse braking below 5m/s
