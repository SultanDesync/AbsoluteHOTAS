; AbsoluteHOTAS.ini - AbsoluteHOTAS 1.6 (Pure Flight Control)
; Place this file in: Data\SFSE\Plugins\AbsoluteHOTAS.ini

[General]
bEnabled = true

[Hardware]
; Legacy device selection fallback. New configurator builds should use [InputDevices].
sDeviceName = vJoy
iVJoyDeviceId = 1

; --- 6DOF Axis Dashboard ---
; Usage IDs: 0x30=X, 0x31=Y, 0x32=Z, 0x33=Rx, 0x34=Ry, 0x35=Rz, 0x36=Slider
iThrottleAxis = 0x32
iPitchAxis = 0x31
iYawAxis = 0x30
iRollAxis = 0x33
iStrafeLatAxis = 0x35
iStrafeVertAxis = 0x34
iReverseAxis = 0x36

; --- Gain & Direction ---
fPitchSensitivity = 1.0
fYawSensitivity = 1.0
fRollSensitivity = 1.0
fStrafeSensitivity = 1.0
fReverseSensitivity = 1.0

bInvertPitch = true
bInvertThrottle = false
bInvertYaw = false
bInvertRoll = false
bInvertStrafeLat = false
bInvertStrafeVert = false
bInvertReverse = false

[InputDevices]
; Per-input DirectInput device selection. Names match case-insensitively against
; DirectInput instance or product names. If a name is empty, the index fallback is used.
; Recording should write source buttons from sShipButtonDeviceName/iShipButtonDeviceIndex.
sAxisDeviceName = vJoy
iAxisDeviceIndex = 0
sShipButtonDeviceName = vJoy
iShipButtonDeviceIndex = 0

[Buttons]
; Optional: buttons to activate/deactivate injection (DirectInput buttons, 1-indexed)
; Set to -1 to disable. Currently unused (always active while piloting).
iActivateButtonId = 69
iStopButtonId = 70
iBoostButtonId = -1

[ShipButtons]
; Optional HOTAS ship action buttons. Button IDs are 1-indexed DirectInput buttons.
; Any DirectInput button ID from 1..128 can be assigned to each action.
; Set bShipButtonsEnabled=false to leave all ship button output to Joystick Gremlin or Starfield.
; Set an individual action to -1 to disable that binding.
; Ship outputs mirror physical vJoy button duration.
bShipButtonsEnabled = true
iFireBoostersButton = -1
iSwitchFlightModesButton = -1
iTogglePovButton = -1
iFireWeapon0Button = -1
iFireWeapon1Button = -1
iFireWeapon2Button = -1
iShipAction1Button = -1
iSelectTargetButton = -1
iIncreaseSystemPowerButton = -1
iDecreaseSystemPowerButton = -1
iPreviousSystemButton = -1
iNextSystemButton = -1
iOpenScannerButton = -1
iRepairButton = -1
iShipAlternateControlHoldButton = -1
iCruiseButton = -1
iCancelButton = -1
iUndockTakeOffButton = -1
iGetUpButton = -1
iExitShipFromCockpitButton = -1
iZoomCameraInButton = -1
iZoomCameraOutButton = -1
iAutopilotOnOffButton = -1

[ShipButtonOutputs]
; Optional emitted keyboard/mouse outputs for ship actions. The defaults below
; match vanilla Starfield spaceship bindings. Omit an action, or leave an action
; unset, to use the plugin's vanilla default for that action.
; Set an action to none to disable its emitted output.
; Accepted formats: key:0xNN, mouse:1, mouse:2, mouse:3, mouse:4, none.
; See docs/reference/key-output-reference.md for the keyboard/mouse output table.
sFireBoostersOutput = key:0x2A
sSwitchFlightModesOutput = key:0x39
sTogglePovOutput = key:0x10
sFireWeapon0Output = mouse:1
sFireWeapon1Output = mouse:2
sFireWeapon2Output = key:0x22
sShipAction1Output = key:0x13
sSelectTargetOutput = key:0x12
sIncreaseSystemPowerOutput = key:0x48
sDecreaseSystemPowerOutput = key:0x50
sPreviousSystemOutput = key:0x4B
sNextSystemOutput = key:0x4D
sOpenScannerOutput = key:0x21
sRepairOutput = key:0x18
sShipAlternateControlHoldOutput = key:0x38
sCruiseOutput = key:0x14
sCancelOutput = none
sUndockTakeOffOutput = key:0x39
sGetUpOutput = key:0x12
sExitShipFromCockpitOutput = key:0x2D
sZoomCameraInOutput = mouse:1
sZoomCameraOutOutput = mouse:2
sAutopilotOnOffOutput = key:0x39

[ButtonExpansion]
; Optional raw DirectInput button passthroughs for extra controls.
; Syntax: iButton<1..128> = key:0xNN, mouse:1, mouse:2, mouse:3, mouse:4, or none.
; These do not change Starfield's ControlMap_Custom.txt by themselves.
; Example:
; iButton99 = key:0x14
; iButton100 = key:0x01

[Normalization]
; Throttle calibration:
;   Default beta mode is unipolar: the throttle axis maps min..max to 0..100% thrust.
;   Reverse slider memory injection is controlled separately by
;   bReverseAxisEnabled, iReverseAxis, and fReverseActivationThreshold.
;   Leave bReverseEnabled=false unless using legacy center-detent throttle reverse.
;   iDetentCenter/iDetentDeadzone are only used when bUnipolarMode=false.
iDetentCenter = 32768
iDetentDeadzone = 500
bReverseEnabled = false
bUnipolarMode = true
fIdlePlateau = 0.05
fReverseDeadzone = 0.05
fReverseActivationThreshold = 0.05

[Injection]
iPollRateHz = 120
iThrottleBurstMs = 250
bLogThrottle = false
bReverseAxisEnabled = true
bDisableCameraGate = false
bRollEnabled = true
; Signpost value: must match fThrottleAtEngineStart in StarfieldCustom.ini (default 0.0314)
fSignpostValue = 0.0314
fSignpostTolerance = 0.0025

[DigitalAxes]
iDigitalReverseButton = -1
iDigitalRollLeftButton = -1
iDigitalRollRightButton = -1
iDigitalStrafeLeftButton = -1
iDigitalStrafeRightButton = -1
iDigitalStrafeUpButton = -1
iDigitalStrafeDownButton = -1
fDigitalRollValue = 1.0
fDigitalStrafeValue = 1.0

[Papyrus]
; Full runtime FormID for the AbsoluteHOTAS_IsPiloting GlobalVariable.
; In-game, use: help AbsoluteHOTAS_IsPiloting 4 GLOB
iPilotGlobalFormID = 0x04000807
