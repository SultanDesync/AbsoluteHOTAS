; AbsoluteHOTAS.ini - AbsoluteHOTAS 2.0.1 (Direct HID + In-Game UI)
; Place this file in: Data\SFSE\Plugins\AbsoluteHOTAS.ini
; Configure bindings in-game with Ctrl+Alt+B, or manually edit below.

[General]
bEnabled = true

[Hardware]
; --- 6DOF Axis Bindings ---
; Bind input devices to axes using DeviceName@UsageID syntax.
; Device names are matched case-insensitively against DirectInput product names.
; If no device name is prefixed (e.g., '0x32'), the first device with that usage is used.
;
; Usage IDs: 0x30=X, 0x31=Y, 0x32=Z, 0x33=Rx, 0x34=Ry, 0x35=Rz, 0x36=Slider 0, 0x37=Slider 1
; Examples: 
;   iThrottleAxis = My Throttle@0x32
;   iPitchAxis = My Stick@0x31
;   iYawAxis = 0x30
;
; Use the in-game binding wizard (Ctrl+Alt+B) to auto-detect your hardware.
; Leave empty or set to -1 to leave an axis unbound (game controls it natively).
iThrottleAxis = 
iPitchAxis = 
iYawAxis = 
iRollAxis = 
iStrafeLatAxis = 
iStrafeVertAxis = 

; --- Per-Axis Settings ---
; Inversion: set to true to flip the axis direction.
; Sensitivity: multiplier applied after normalization (default 1.0).
bInvertThrottle = false
bInvertPitch = false
bInvertYaw = false
bInvertRoll = false
bInvertStrafeLat = false
bInvertStrafeVert = false

fPitchSensitivity = 1.0
fYawSensitivity = 1.0
fRollSensitivity = 1.0
fStrafeSensitivity = 1.0

[Buttons]
; If true, discovery arms automatically when the DLL starts.
; The activate/stop buttons remain available for manual reset/stop.
; Ctrl+Alt+F8 is also reserved as a keyboard fail-safe reset.
bAlwaysOn = true
; Optional: buttons to activate/deactivate injection (DirectInput buttons, 1-indexed)
; Set to -1 to disable. Use Ctrl+Alt+B to bind via the in-game wizard.
iActivateButtonId = -1
iStopButtonId = -1

[ShipButtons]
; HOTAS ship action buttons. Button IDs are 1-indexed DirectInput buttons.
; Prefix with device name for multi-device setups: VKB Gunfighter@44
; Set bShipButtonsEnabled=false to disable all ship button output.
; Set an individual action to -1 to leave it unbound.
bShipButtonsEnabled = true
iFireBoostersButton = -1
iSwitchFlightModesButton = -1
iTogglePovButton = -1
iFireWeapon0Button = -1
iFireWeapon1Button = -1
iFireWeapon2Button = -1
iShipAction1Button = -1
iSelectTargetButton = -1
iIncreaseSystemPowerButton = -1
iDecreaseSystemPowerButton = -1
iPreviousSystemButton = -1
iNextSystemButton = -1
iOpenScannerButton = -1
iRepairButton = -1
iShipAlternateControlHoldButton = -1
iCruiseButton = -1
iCancelButton = -1
iUndockTakeOffButton = -1
iGetUpButton = -1
iExitShipFromCockpitButton = -1
iZoomCameraInButton = -1
iZoomCameraOutButton = -1
iAutopilotOnOffButton = -1

[ShipButtonOutputs]
; Keyboard/mouse outputs emitted when ship buttons are pressed.
; Defaults match vanilla Starfield bindings. Omit to use defaults.
; Formats: key:0xNN, mouse:1..4, none
sFireBoostersOutput = key:0x2A
sSwitchFlightModesOutput = key:0x39
sTogglePovOutput = key:0x10
sFireWeapon0Output = mouse:1
sFireWeapon1Output = mouse:2
sFireWeapon2Output = key:0x22
sShipAction1Output = key:0x13
sSelectTargetOutput = key:0x12
sIncreaseSystemPowerOutput = key:0x48
sDecreaseSystemPowerOutput = key:0x50
sPreviousSystemOutput = key:0x4B
sNextSystemOutput = key:0x4D
sOpenScannerOutput = key:0x21
sRepairOutput = key:0x18
sShipAlternateControlHoldOutput = key:0x38
sCruiseOutput = key:0x14
sCancelOutput = none
sUndockTakeOffOutput = key:0x39
sGetUpOutput = key:0x12
sExitShipFromCockpitOutput = key:0x2D
sZoomCameraInOutput = mouse:1
sZoomCameraOutOutput = mouse:2
sAutopilotOnOffOutput = key:0x39

[ButtonExpansion]
; Optional raw DirectInput button passthroughs for extra controls.
; Syntax: iButton<1..128> = key:0xNN, mouse:1..4, or none.
; Example:
; iButton99 = key:0x14

[Normalization]
; --- Throttle Calibration ---
; Default: Unipolar mode. Physical min = 0% thrust, physical max = 100% thrust.
; fIdlePlateau: bottom percentage of travel treated as idle (masks pot noise).
;               Increase to 0.08-0.10 for noisy/low-resolution throttles.
bUnipolarMode = true
fIdlePlateau = 0.05

; --- Advanced: Center-Detent Bipolar Throttle ---
; Only add these settings if you have a center-detent throttle where
; center = idle, forward = thrust, backward = reverse.
; WARNING: Setting bUnipolarMode=false with a standard throttle will cause
; only the top half of your throttle range to produce forward thrust.
; iDetentCenter = 32768
; iDetentDeadzone = 500
; bUnipolarMode = false

; --- Advanced: Dedicated Reverse Axis ---
; Only add these settings if you have a separate physical reverse slider/axis.
; WARNING: Enabling bReverseAxisEnabled without binding iReverseAxis will cause
; constant phantom reverse input. Leave disabled unless you have the hardware.
; iReverseAxis =
; bReverseAxisEnabled = false
; bInvertReverse = false
; fReverseSensitivity = 1.0
; fReverseDeadzone = 0.05
; fReverseActivationThreshold = 0.05

; --- Advanced: Legacy Center-Detent Reverse ---
; bReverseEnabled uses the throttle axis itself for reverse (below center = reverse).
; Only for center-detent throttles with bUnipolarMode=false.
; bReverseEnabled = false

; --- HOSAS Incremental Throttle (Experimental) ---
; For centering, spring-loaded joystick axes used as throttle.
; Displacement = rate of speed change. Release = cruise lock.
; bIncrementalThrottleMode = false
; fThrottleRampRate = 0.67

; --- Physics Adherence (Experimental) ---
; Suspends throttle injection during hard turns so the game's physics can bleed speed.
; bPhysicsAdherenceMode = false
; fPhysicsAdherenceDeflection = 0.15
; fPhysicsAdherenceThrottleThreshold = 0.50

; --- Keyboard Pulse Mode (Experimental) ---
; Pulses W/S keys based on stick displacement. Zero memory injection for throttle.
; bIncrementalKeyboardMode = false

[Injection]
iPollRateHz = 120
iThrottleBurstMs = 250
bLogThrottle = false
bDisableCameraGate = false
bRollEnabled = true
; Signpost value: must match fThrottleAtEngineStart in StarfieldCustom.ini
fSignpostValue = 0.0314
fSignpostTolerance = 0.0025

[DigitalAxes]
; Bind buttons to emulate axis input digitally (on/off).
; Useful for hat switches. Use the wizard (Ctrl+Alt+B) or set manually.
iDigitalReverseButton = -1
iDigitalRollLeftButton = -1
iDigitalRollRightButton = -1
iDigitalStrafeLeftButton = -1
iDigitalStrafeRightButton = -1
iDigitalStrafeUpButton = -1
iDigitalStrafeDownButton = -1
fDigitalRollValue = 1.0
fDigitalStrafeValue = 1.0
