; AbsoluteHOTAS.ini - AbsoluteHOTAS 2.0 (Direct HID + In-Game UI)
; Place this file in: Data\SFSE\Plugins\AbsoluteHOTAS.ini
; Configure bindings in-game with Ctrl+Alt+B, or manually edit below.

[General]
bEnabled = true

[Hardware]
; --- 6DOF Axis Dashboard ---
; Bind input devices to axes using DeviceName@UsageID syntax.
; Device names are matched case-insensitively against DirectInput instance or product names.
; If no device name is prefixed (e.g., '0x32'), the first device with that usage is used.
;
; Usage IDs: 0x30=X, 0x31=Y, 0x32=Z, 0x33=Rx, 0x34=Ry, 0x35=Rz, 0x36=Slider 0, 0x37=Slider 1
; Examples: 
;   iThrottleAxis = My Throttle@0x32
;   iPitchAxis = My Stick@0x31
;   iYawAxis = 0x30
;
; Use the in-game binding wizard (Ctrl+Alt+B) to auto-detect your hardware.
iThrottleAxis = 
iPitchAxis = 
iYawAxis = 
iRollAxis = 
iStrafeLatAxis = 
iStrafeVertAxis = 
iReverseAxis = 

; --- Gain & Direction ---

[Buttons]
; If true, discovery arms automatically when the DLL starts.
; The activate/stop buttons remain available for manual reset/stop.
; Ctrl+Alt+F8 is also reserved as a keyboard fail-safe reset.
bAlwaysOn = true
; Optional: buttons to activate/deactivate injection (DirectInput buttons, 1-indexed)
; Set to -1 to disable. Use Ctrl+Alt+B to bind via the in-game wizard.
; Note: iBoostButtonId is deprecated in 2.0. Use iFireBoostersButton in [ShipButtons] instead.
iActivateButtonId = -1
iStopButtonId = -1

[ShipButtons]
; Optional HOTAS ship action buttons. Button IDs are 1-indexed DirectInput buttons.
; Any DirectInput button ID from 1..128 can be assigned to each action.
; Set bShipButtonsEnabled=false to leave all ship button output to Joystick Gremlin or Starfield.
; Set an individual action to -1 to disable that binding.
; Ship outputs mirror physical vJoy button duration.
bShipButtonsEnabled = true
iFireBoostersButton = -1
iSwitchFlightModesButton = -1
iTogglePovButton = -1
iFireWeapon0Button = -1
iFireWeapon1Button = -1
iFireWeapon2Button = -1
iShipAction1Button = -1
iSelectTargetButton = -1
iIncreaseSystemPowerButton = -1
iDecreaseSystemPowerButton = -1
iPreviousSystemButton = -1
iNextSystemButton = -1
iOpenScannerButton = -1
iRepairButton = -1
iShipAlternateControlHoldButton = -1
iCruiseButton = -1
iCancelButton = -1
iUndockTakeOffButton = -1
iGetUpButton = -1
iExitShipFromCockpitButton = -1
iZoomCameraInButton = -1
iZoomCameraOutButton = -1
iAutopilotOnOffButton = -1

[ShipButtonOutputs]
; Optional emitted keyboard/mouse outputs for ship actions. The defaults below
; match vanilla Starfield spaceship bindings. Omit an action, or leave an action
; unset, to use the plugin's vanilla default for that action.
; Set an action to none to disable its emitted output.
; Accepted formats: key:0xNN, mouse:1, mouse:2, mouse:3, mouse:4, none.
; See docs/reference/key-output-reference.md for the keyboard/mouse output table.
sFireBoostersOutput = key:0x2A
sSwitchFlightModesOutput = key:0x39
sTogglePovOutput = key:0x10
sFireWeapon0Output = mouse:1
sFireWeapon1Output = mouse:2
sFireWeapon2Output = key:0x22
sShipAction1Output = key:0x13
sSelectTargetOutput = key:0x12
sIncreaseSystemPowerOutput = key:0x48
sDecreaseSystemPowerOutput = key:0x50
sPreviousSystemOutput = key:0x4B
sNextSystemOutput = key:0x4D
sOpenScannerOutput = key:0x21
sRepairOutput = key:0x18
sShipAlternateControlHoldOutput = key:0x38
sCruiseOutput = key:0x14
sCancelOutput = none
sUndockTakeOffOutput = key:0x39
sGetUpOutput = key:0x12
sExitShipFromCockpitOutput = key:0x2D
sZoomCameraInOutput = mouse:1
sZoomCameraOutOutput = mouse:2
sAutopilotOnOffOutput = key:0x39

[ButtonExpansion]
; Optional raw DirectInput button passthroughs for extra controls.
; Syntax: iButton<1..128> = key:0xNN, mouse:1, mouse:2, mouse:3, mouse:4, or none.
; These do not change Starfield's ControlMap_Custom.txt by themselves.
; Example:
; iButton99 = key:0x14
; iButton100 = key:0x01

[Normalization]
; Throttle calibration:
;   Default beta mode is unipolar: the throttle axis maps min..max to 0..100% thrust.
;   Reverse slider memory injection is controlled separately by
;   bReverseAxisEnabled, iReverseAxis, and fReverseActivationThreshold.
;   Leave bReverseEnabled=false unless using legacy center-detent throttle reverse.
;   iDetentCenter/iDetentDeadzone are only used when bUnipolarMode=false.
iDetentCenter = 32768
iDetentDeadzone = 500
bReverseEnabled = false
bUnipolarMode = true
fIdlePlateau = 0.05
fReverseDeadzone = 0.05
fReverseActivationThreshold = 0.05

; HOSAS Incremental Throttle Mode (Experimental):
;   Set bIncrementalThrottleMode=true if using a centering, spring-loaded joystick axis.
;   Instead of 1:1 mapping (which resets throttle to zero when stick springs to center),
;   displacing the stick acts as a rate accelerator/decelerator. Releasing the stick
;   leaves throttle cruise locked, allowing full autopilot, boost, and landing sequences.
;   fThrottleRampRate determines the speed range units changed per second at maximum stick displacement.
;   e.g., 0.67 means going from 0% to 100% throttle takes 1.5 seconds.
bIncrementalThrottleMode = false
fThrottleRampRate = 0.67

; Physics Adherence Mode (Experimental):
;   Set bPhysicsAdherenceMode=true to automatically release memory-injection throttle control
;   when the right stick (pitch and yaw) is actively deflected (>15% deflection by default)
;   AND current throttle is high (>50% by default). This allows Starfield's native physics
;   engine to limit ship speed during turns, while still allowing you to feather the throttle
;   manually below 50% for tighter turns.
;   fPhysicsAdherenceDeflection: the deflection threshold from neutral (0.0 to 1.0) to activate release.
;   fPhysicsAdherenceThrottleThreshold: the throttle threshold (0.0 to 1.0) above which control is released.
bPhysicsAdherenceMode = false
fPhysicsAdherenceDeflection = 0.15
fPhysicsAdherenceThrottleThreshold = 0.50

; Keyboard Emulation Pulse Mode (Experimental Alpha):
;   Set bIncrementalKeyboardMode=true to dynamically pulse W/S keys based on stick displacement.
;   Provides zero-dependency HOSAS throttle adjustment without downstream memory override wiggles.
bIncrementalKeyboardMode = false

[Injection]
iPollRateHz = 120
iThrottleBurstMs = 250
bLogThrottle = false
bReverseAxisEnabled = true
bDisableCameraGate = false
bRollEnabled = true
; Signpost value: must match fThrottleAtEngineStart in StarfieldCustom.ini (default 0.0314)
fSignpostValue = 0.0314
fSignpostTolerance = 0.0025

[DigitalAxes]
iDigitalReverseButton = -1
iDigitalRollLeftButton = -1
iDigitalRollRightButton = -1
iDigitalStrafeLeftButton = -1
iDigitalStrafeRightButton = -1
iDigitalStrafeUpButton = -1
iDigitalStrafeDownButton = -1
fDigitalRollValue = 1.0
fDigitalStrafeValue = 1.0
