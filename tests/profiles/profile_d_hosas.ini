; AbsoluteHOTAS Test Profile D: HOSAS (Dual Stick)
; Scheme: Dual-stick with self-centering accumulator throttle
; Usage: Copy to SFSE/Plugins/AbsoluteHOTAS.ini before testing
; Validates: S7 (accumulator throttle), S8 (stick pitch/yaw)

[General]
bEnabled = true

[Hardware]
iThrottleAxis = 0x32
iPitchAxis    = 0x34
iYawAxis      = 0x33
iRollAxis     =
iStrafeLatAxis  = 0x30
iStrafeVertAxis = 0x31

bInvertThrottle = false
bInvertPitch = false
bInvertYaw = false
bInvertRoll = false
bInvertStrafeLat = false
bInvertStrafeVert = false

fPitchSensitivity = 1.0
fYawSensitivity = 1.0
fRollSensitivity = 1.0
fStrafeSensitivity = 1.0
fThrottleSensitivity = 1.0

fThrottleSaturation = 1.0
fPitchSaturation = 1.0
fYawSaturation = 1.0
fRollSaturation = 1.0
fStrafeSaturation = 1.0
fStrafeVertSaturation = 1.0

fPitchDeadzone = 0.0
fYawDeadzone = 0.0
fRollDeadzone = 0.0
fStrafeDeadzone = 0.05
fStrafeVertDeadzone = 0.05

[Buttons]
bAlwaysOn = true
iActivateButtonId = -1
iStopButtonId = -1
iToggleWizardButton = -1

[ShipButtons]
bShipButtonsEnabled = false

[Normalization]
bUnipolarMode = false
iDetentCenter = 32768
iDetentDeadzone = 500
bUnipolarReverse = false
bBoostZone = false
bReverseAxisEnabled = false

[Injection]
iPollRateHz = 120
iThrottleBurstMs = 250
bEnableLog = false
bHoldForBoost = true
bRollEnabled = true

[Aim]
bSourceObjectAim = false
bHOSAMMode = false
bMirrorFlightToAim = true

[DualStick]
bAccumulatorThrottle = true
fAccumulatorRate = 1.0
fAccumulatorDecay = 0.5
fReverseGateVelocity = 5.0
