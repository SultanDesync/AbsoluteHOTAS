; AbsoluteHOTAS Test Profile F: Source-Object Aim (Separate Axes)
; Scheme: HOTAS with independent aim axes on a second device
; Usage: Copy to SFSE/Plugins/AbsoluteHOTAS.ini before testing
; Validates: S10 (separate aim stick doesn't steer ship)
;
; NOTE: Replace SecondDevice with the actual device name from your setup,
; or use the wizard to bind these axes.

[General]
bEnabled = true

[Hardware]
iThrottleAxis = 0x32
iPitchAxis    = 0x34
iYawAxis      = 0x33
iRollAxis     = 0x33
iStrafeLatAxis  = 0x30
iStrafeVertAxis = 0x31

bInvertThrottle = false
bInvertPitch = false
bInvertYaw = false
bInvertRoll = false
bInvertStrafeLat = false
bInvertStrafeVert = false

fPitchSensitivity = 1.0
fYawSensitivity = 1.0
fRollSensitivity = 1.0
fStrafeSensitivity = 1.0
fThrottleSensitivity = 1.0

fThrottleSaturation = 1.0
fPitchSaturation = 1.0
fYawSaturation = 1.0
fRollSaturation = 1.0
fStrafeSaturation = 1.0
fStrafeVertSaturation = 1.0

fPitchDeadzone = 0.0
fYawDeadzone = 0.0
fRollDeadzone = 0.0
fStrafeDeadzone = 0.05
fStrafeVertDeadzone = 0.05

[Buttons]
bAlwaysOn = true
iActivateButtonId = -1
iStopButtonId = -1
iToggleWizardButton = -1

[ShipButtons]
bShipButtonsEnabled = false

[Normalization]
bUnipolarMode = true
fIdlePlateau = 0.05
bUnipolarReverse = false
bBoostZone = false
bReverseAxisEnabled = false

[Injection]
iPollRateHz = 120
iThrottleBurstMs = 250
bEnableLog = false
bHoldForBoost = true
bRollEnabled = true

[Aim]
bSourceObjectAim = true
fAimSensitivity = 1.0
bMirrorFlightToAim = false
iAimYawAxis   = SecondDevice@0x33
iAimPitchAxis = SecondDevice@0x34
fAimYawSensitivity = 1.0
fAimPitchSensitivity = 1.0
bInvertAimYaw = false
bInvertAimPitch = false
bHOSAMMode = false

[DualStick]
bAccumulatorThrottle = false
