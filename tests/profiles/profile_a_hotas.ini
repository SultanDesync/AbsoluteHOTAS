; AbsoluteHOTAS Test Profile A: Pure HOTAS
; Scheme: Traditional HOTAS — stick steers ship, throttle controls speed
; Usage: Copy to SFSE/Plugins/AbsoluteHOTAS.ini before testing
; Validates: S1 (throttle), S2 (pitch/yaw), S3 (roll/strafe)

[General]
bEnabled = true

[Hardware]
iThrottleAxis = 0x32
iPitchAxis    = 0x34
iYawAxis      = 0x33
iRollAxis     = 0x33
iStrafeLatAxis  = 0x30
iStrafeVertAxis = 0x31

bInvertThrottle = false
bInvertPitch = false
bInvertYaw = false
bInvertRoll = false
bInvertStrafeLat = false
bInvertStrafeVert = false

fPitchSensitivity = 1.0
fYawSensitivity = 1.0
fRollSensitivity = 1.0
fStrafeSensitivity = 1.0
fThrottleSensitivity = 1.0

fThrottleSaturation = 1.0
fPitchSaturation = 1.0
fYawSaturation = 1.0
fRollSaturation = 1.0
fStrafeSaturation = 1.0
fStrafeVertSaturation = 1.0

fPitchDeadzone = 0.0
fYawDeadzone = 0.0
fRollDeadzone = 0.0
fStrafeDeadzone = 0.05
fStrafeVertDeadzone = 0.05

[Buttons]
bAlwaysOn = true
iActivateButtonId = -1
iStopButtonId = -1
iToggleWizardButton = -1

[ShipButtons]
bShipButtonsEnabled = false

[Normalization]
bUnipolarMode = true
fIdlePlateau = 0.05
bUnipolarReverse = false
bBoostZone = false
bReverseAxisEnabled = false

[Injection]
iPollRateHz = 120
iThrottleBurstMs = 250
bEnableLog = false
bHoldForBoost = true
bRollEnabled = true

[Aim]
bSourceObjectAim = false
bHOSAMMode = false
bMirrorFlightToAim = true

[DualStick]
bAccumulatorThrottle = false
