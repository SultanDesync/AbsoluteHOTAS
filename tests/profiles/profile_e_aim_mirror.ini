; AbsoluteHOTAS Test Profile E: Source-Object Aim (Mirror)
; Scheme: HOTAS with aim reticle mirrored from flight stick
; Usage: Copy to SFSE/Plugins/AbsoluteHOTAS.ini before testing
; Validates: S9 (reticle tracks stick), aim-driven steering

[General]
bEnabled = true

[Hardware]
iThrottleAxis = 0x32
iPitchAxis    = 0x34
iYawAxis      = 0x33
iRollAxis     = 0x33
iStrafeLatAxis  = 0x30
iStrafeVertAxis = 0x31

bInvertThrottle = false
bInvertPitch = false
bInvertYaw = false
bInvertRoll = false
bInvertStrafeLat = false
bInvertStrafeVert = false

fPitchSensitivity = 1.0
fYawSensitivity = 1.0
fRollSensitivity = 1.0
fStrafeSensitivity = 1.0
fThrottleSensitivity = 1.0

fThrottleSaturation = 1.0
fPitchSaturation = 1.0
fYawSaturation = 1.0
fRollSaturation = 1.0
fStrafeSaturation = 1.0
fStrafeVertSaturation = 1.0

fPitchDeadzone = 0.0
fYawDeadzone = 0.0
fRollDeadzone = 0.0
fStrafeDeadzone = 0.05
fStrafeVertDeadzone = 0.05

[Buttons]
bAlwaysOn = true
iActivateButtonId = -1
iStopButtonId = -1
iToggleWizardButton = -1

[ShipButtons]
bShipButtonsEnabled = false

[Normalization]
bUnipolarMode = true
fIdlePlateau = 0.05
bUnipolarReverse = false
bBoostZone = false
bReverseAxisEnabled = false

[Injection]
iPollRateHz = 120
iThrottleBurstMs = 250
bLogThrottle = false
bHoldForBoost = true
bRollEnabled = true

[Aim]
bSourceObjectAim = true
fAimSensitivity = 1.0
bMirrorFlightToAim = true
iAimYawAxis =
iAimPitchAxis =
bHOSAMMode = false

[DualStick]
bAccumulatorThrottle = false
