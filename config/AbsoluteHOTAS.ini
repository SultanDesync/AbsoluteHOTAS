; AbsoluteHOTAS.ini - v4.0.2
; Configure bindings in-game with Ctrl+Alt+B (recommended).
; See docs/reference/ini-reference.md for key documentation.
;
; This file is MOD-OWNED: a release may overwrite it. Your bindings, calibration,
; tuning, macros, and profile routing live in AbsoluteHOTAS_Custom.ini,
; which the wizard writes and no update touches. Values there override this file.

[General]
bEnabled = true

; Auto-align ship button outputs to your in-game Starfield key bindings by reading
; ControlMap_Custom.txt. If you rebind a ship control in Starfield's own settings,
; the plugin follows it automatically. An explicit [ShipButtonOutputs] value always
; wins. Set to false to always use vanilla defaults.
bSyncShipOutputsFromControlMap = true

[UI]
; Optional in-game configuration workbench. Set false to install no D3D12/DXGI
; hooks; manual INI configuration and all flight controls remain active.
bEnableWorkbench = true

[Hardware]
; Axis bindings: DeviceName@UsageID or plain UsageID. Use wizard to auto-detect.
iThrottleAxis = 
iPitchAxis = 
iYawAxis = 
iRollAxis = 
iStrafeLatAxis = 
iStrafeVertAxis = 

bInvertThrottle = false
bInvertPitch = false
bInvertYaw = false
bInvertRoll = false
bInvertStrafeLat = false
bInvertStrafeVert = false

fPitchSensitivity = 1.0
fYawSensitivity = 1.0
fRollSensitivity = 1.0
fStrafeSensitivity = 1.0
fThrottleSensitivity = 1.0

fThrottleSaturation = 1.0
fPitchSaturation = 1.0
fYawSaturation = 1.0
fRollSaturation = 1.0
fStrafeSaturation = 1.0
fStrafeVertSaturation = 1.0
fReverseSaturation = 1.0

fThrottleDeadzone = 0.0
fPitchDeadzone = 0.0
fYawDeadzone = 0.0
fRollDeadzone = 0.0
fStrafeDeadzone = 0.05
fStrafeVertDeadzone = 0.05

[Buttons]
bAlwaysOn = true
iActivateButtonId = -1
iStopButtonId = -1
iToggleWizardButton = -1
; Keyboard key (Windows virtual-key code) that toggles the whole mod on/off.
; Deactivating releases all injected keys/mouse and stops axis injection, so it
; doubles as a panic kill for ghost inputs on foot. 0 = disabled.
; Default 0x91 = ScrollLock. Examples: 0x13 = Pause/Break, 0x77 = F8.
iToggleActiveKey = 0x91

[ControlExtensions]
; Native AbsoluteHOTAS flight-assist commands. Each is a toggle; activating one
; replaces any other latched throttle target, and pressing it again returns control
; to the hardware throttle axis.
iCruiseHoldButton = -1
iFullStopButton = -1
iCruiseHalfButton = -1
iCruiseMaxButton = -1

[ShipButtons]
bShipButtonsEnabled = true
iFireBoostersButton = -1
iSwitchFlightModesButton = -1
iTogglePovButton = -1
iFireWeapon0Button = -1
iFireWeapon1Button = -1
iFireWeapon2Button = -1
iShipAction1Button = -1
iSelectTargetButton = -1
iIncreaseSystemPowerButton = -1
iDecreaseSystemPowerButton = -1
iPreviousSystemButton = -1
iNextSystemButton = -1
iOpenScannerButton = -1
iRepairButton = -1
iShipAlternateControlHoldButton = -1
iCruiseButton = -1
iCancelButton = -1
iUndockTakeOffButton = -1
iGetUpButton = -1
iExitShipFromCockpitButton = -1
iZoomCameraInButton = -1
iZoomCameraOutButton = -1
iAutopilotOnOffButton = -1

[ShipButtonOutputs]
; Each action's output defaults to YOUR in-game Starfield binding, read from
; ControlMap_Custom.txt (see [General] bSyncShipOutputsFromControlMap), falling
; back to the vanilla Starfield key shown below. So if you rebind a ship control
; in Starfield's settings, the plugin follows it automatically — no edits here.
;
; Uncomment and set a line ONLY to force a specific output regardless of your
; in-game binding. Formats: key:0xNN, mouse:1..4, none
; (Re-reads on startup and when you Save in the wizard.)
;
; sFireBoostersOutput = key:0x2A
; sSwitchFlightModesOutput = key:0x39
; sTogglePovOutput = key:0x10
; sFireWeapon0Output = mouse:1
; sFireWeapon1Output = mouse:2
; sFireWeapon2Output = key:0x22
; sShipAction1Output = key:0x13
; sSelectTargetOutput = key:0x12
; sIncreaseSystemPowerOutput = key:0x48
; sDecreaseSystemPowerOutput = key:0x50
; sPreviousSystemOutput = key:0x4B
; sNextSystemOutput = key:0x4D
; sOpenScannerOutput = key:0x21
; sRepairOutput = key:0x18
; sShipAlternateControlHoldOutput = key:0x38
; sCruiseOutput = key:0x14
; sCancelOutput = none
; sUndockTakeOffOutput = key:0x39
; sGetUpOutput = key:0x12
; sExitShipFromCockpitOutput = key:0x2D
; sZoomCameraInOutput = mouse:1
; sZoomCameraOutOutput = mouse:2
; sAutopilotOnOffOutput = key:0x39

[ButtonExpansion]
; Button passthroughs: iButton<1..144> = key:0xNN, mouse:1..4, or none
; (1..128 physical buttons; 129..144 POV/hat directions)

[Normalization]
bUnipolarMode = true
fIdlePlateau = 0.05
bUnipolarReverse = false
iReverseZoneCenter = 3000
iReverseZoneDeadzone = 3000
bBoostZone = false
iBoostZoneCenter = 62000
iBoostZoneDeadzone = 2000
bReverseAxisEnabled = true

[Injection]
iPollRateHz = 120
iThrottleBurstMs = 250
bEnableLog = false
bHoldForBoost = true
bRollEnabled = true
; Master switch for flight memory injection (ship cluster + aim). true = normal.
; Mainly for profile overlays: a "parked" profile in Profiles/ sets this false to
; disable flight injection on foot while its own buttons/macros keep working.
bEnableInjection = true
; Signal Hunter fallback: fall back to the legacy discovery method.
; Enable this if the plugin fails to detect the flight control cluster
; after a game update. Requires the following line in your
; Documents\My Games\Starfield\StarfieldCustom.ini:
;   [Spaceship]
;   fThrottleAtEngineStart = 0.0314
bSignalHunterFallback = false

[DigitalAxes]
iDigitalReverseButton = -1
iDigitalRollLeftButton = -1
iDigitalRollRightButton = -1
iDigitalStrafeLeftButton = -1
iDigitalStrafeRightButton = -1
iDigitalStrafeUpButton = -1
iDigitalStrafeDownButton = -1
fDigitalRollValue = 1.0
fDigitalStrafeValue = 1.0

[Calibration]
; Auto-generated by wizard. Format: iCalib_<deviceIndex>_0x<usageHex> = min,max

[Aim]
bSourceObjectAim = true
fAimSensitivity = 1.0
bMirrorFlightToAim = true
iAimYawAxis =
iAimPitchAxis =
fAimYawSensitivity = 1.0
fAimPitchSensitivity = 1.0
bInvertAimYaw = false
bInvertAimPitch = false
fAimSmoothing = 0.0
iDigitalAimLeftButton = -1
iDigitalAimRightButton = -1
iDigitalAimUpButton = -1
iDigitalAimDownButton = -1
iDigitalAimCenterButton = -1
fDigitalAimValue = 1.0
iToggleAimModeButton = -1
bHOSAMMode = false            ; Enable stick+mouse hybrid mode (releases pitch/yaw to native mouse)
bAlignmentAssist = false      ; Gently decay steering to center when mouse is idle
fAlignmentRadius = 15.0       ; Accumulator radius within which assist activates (0-200)
iAlignmentIdleMs = 80         ; Milliseconds mouse must be idle before decay starts
fAlignmentDecayRate = 4.0     ; Decay speed (higher = faster centering)

[DualStick]
bAccumulatorThrottle = false
fAccumulatorRate = 1.0
fAccumulatorDecay = 0.0
fReverseGateVelocity = 5.0
bAccumulatorTurnAssist = false
iTurnAssistMode = 0
iTurnAssistButton = -1
